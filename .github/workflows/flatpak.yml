# Builds the Flatpak from a release's Linux .deb and attaches the .flatpak file to that release.
# Runs after every release (called by release.yml), by hand, and on changes to the recipe on main
# (then for the version in package.json). Not for Flathub: Flathub needs a recipe written without AI
# that builds from source, see packaging/flatpak/README.md.
name: Flatpak
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'packaging/flatpak/**'
      - '.github/workflows/flatpak.yml'

permissions:
  contents: write

jobs:
  flatpak:
    runs-on: ubuntu-latest
    env:
      # Own update repo (GitHub Pages of Evelynnsrepos/egd-flatpak). Without these secrets the steps for it are skipped.
      FLATPAK_GPG_PRIVATE_KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
      FLATPAK_REPO_TOKEN: ${{ secrets.FLATPAK_REPO_TOKEN }}
      REPO_URL: https://evelynnsrepos.github.io/egd-flatpak/repo
      APP_ID: io.github.Evelynnsrepos.Evelopment-Games-Designer
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Point the recipe at this version's .deb
        id: version
        run: |
          v=$(sed -n 's/.*"version": "\(.*\)".*/\1/p' package.json | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          url="https://github.com/${{ github.repository }}/releases/download/v$v/Evelopment.Games.Designer_${v}_amd64.deb"
          # A push to main can come before the release has its .deb; the release run builds it later.
          if [ "${{ github.event_name }}" = push ] && ! curl -fsIL -o /dev/null "$url"; then
            echo "::notice::v$v has no .deb yet, the release run builds the Flatpak"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          curl -fsSL -o egd.deb "$url"
          sha=$(sha256sum egd.deb | cut -d' ' -f1)
          m=packaging/flatpak/io.github.Evelynnsrepos.Evelopment-Games-Designer.yml
          sed -i "s#url: .*\.deb#url: $url#; s#sha256: .*#sha256: '$sha'#" "$m"
          grep -n "url:\|sha256:" "$m"
      - name: Build
        if: steps.version.outputs.ready == 'true'
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: evelopment-games-designer.flatpak
          manifest-path: packaging/flatpak/io.github.Evelynnsrepos.Evelopment-Games-Designer.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: false
      - name: Every library the app needs is in the runtime
        if: steps.version.outputs.ready == 'true'
        run: |
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive evelopment-games-designer.flatpak
          missing=$(flatpak run --command=sh io.github.Evelynnsrepos.Evelopment-Games-Designer -c 'ldd /app/bin/evelopment-games-designer | grep "not found"' || true)
          echo "$missing"
          test -z "$missing"
      # Update repo: add this build to the Pages repo, so installs made from the .flatpak below update through Flatpak.
      - name: Add the build to the update repo
        if: steps.version.outputs.ready == 'true' && env.FLATPAK_GPG_PRIVATE_KEY != '' && env.FLATPAK_REPO_TOKEN != ''
        run: |
          set -eu
          export GNUPGHOME=$(mktemp -d)
          echo "$FLATPAK_GPG_PRIVATE_KEY" | gpg --batch --import
          key=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          gpg --export "$key" > pub.gpg
          git clone --depth 1 --branch gh-pages "https://x-access-token:$FLATPAK_REPO_TOKEN@github.com/Evelynnsrepos/egd-flatpak.git" site \
            || { git init -b gh-pages site; git -C site remote add origin "https://x-access-token:$FLATPAK_REPO_TOKEN@github.com/Evelynnsrepos/egd-flatpak.git"; }
          [ -f site/repo/config ] || ostree init --mode=archive-z2 --repo=site/repo
          ref=$(ostree refs --repo=repo | grep "^app/$APP_ID/" | head -1)
          flatpak build-commit-from --src-repo=repo --gpg-sign="$key" site/repo "$ref"
          # Keep the last 3 versions: GitHub Pages has a 1 GB limit.
          flatpak build-update-repo --prune --prune-depth=3 --generate-static-deltas --gpg-sign="$key" \
            --title="EVLMG Designer" site/repo
          b64=$(base64 -w0 pub.gpg)
          printf '[Flatpak Repo]\nTitle=EVLMG Designer\nUrl=%s\nHomepage=https://github.com/Evelynnsrepos/EVLMG-Designer\nGPGKey=%s\n' "$REPO_URL" "$b64" > site/egd.flatpakrepo
          printf '[Flatpak Ref]\nName=%s\nBranch=%s\nTitle=EVLMG Designer\nUrl=%s\nSuggestRemoteName=egd\nRuntimeRepo=https://dl.flathub.org/repo/flathub.flatpakrepo\nIsRuntime=false\nGPGKey=%s\n' \
            "$APP_ID" "${ref##*/}" "$REPO_URL" "$b64" > site/egd.flatpakref
          touch site/.nojekyll
          # The bundle people download remembers the repo, so Software/Discover and `flatpak update` find new versions.
          flatpak build-bundle --repo-url="$REPO_URL" --gpg-keys=pub.gpg --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            site/repo evelopment-games-designer.flatpak "$APP_ID" "${ref##*/}"
          # One commit only (no history), so the Pages repo doesn't grow with every release.
          cd site
          git checkout --orphan next
          git add -A
          git -c user.name=release-bot -c user.email=release-bot@users.noreply.github.com commit -qm "v${{ steps.version.outputs.version }}"
          git push -f origin next:gh-pages
      - name: Attach it to the release
        if: steps.version.outputs.ready == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=${{ steps.version.outputs.version }}
          api=https://api.github.com/repos/${{ github.repository }}
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$api/releases/tags/v$v" > release.json
          id=$(python3 -c "import json; print(json.load(open('release.json'))['id'])")
          name="Evelopment.Games.Designer_${v}_x86_64.flatpak"
          # Replace an older upload of the same file.
          old=$(python3 -c "import json; print(next((a['id'] for a in json.load(open('release.json'))['assets'] if a['name'] == '$name'), ''))")
          if [ -n "$old" ]; then curl -fsS -X DELETE -H "Authorization: Bearer $TOKEN" "$api/releases/assets/$old"; fi
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/octet-stream" \
            --data-binary @evelopment-games-designer.flatpak \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$id/assets?name=$name" > /dev/null
          echo "Attached $name to v$v"
